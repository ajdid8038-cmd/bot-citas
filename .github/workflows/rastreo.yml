name: Rastrear Citas Extranjeria

on:
  schedule:
    - cron: '*/15 7-18 * * 1-5'
  workflow_dispatch:

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests cloudscraper fake-useragent

      - name: Run script
        run: python bot.py
